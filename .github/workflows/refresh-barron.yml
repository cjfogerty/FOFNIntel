name: Refresh Jackrabbit competitor dashboards (Barron + Bear Paddle)

on:
  schedule:
    # Mondays 12:00 UTC (7am CT / 6am CDT) -- matches the other weekly FOFNIntel-style pulls
    - cron: "0 12 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          pip install -r requirements-barron.txt
          playwright install --with-deps chromium

      - name: Extract + build each location
        env:
          BARRON_EMAIL: ${{ secrets.BARRON_EMAIL }}
          BARRON_PASSWORD: ${{ secrets.BARRON_PASSWORD }}
        run: |
          set -e
          DATE="$(date -u +%Y-%m-%d)"
          BARRON_JSON=$(python3 -c "import json,build_barron_dashboard as b; print(json.dumps(b.BARRON_LOCATIONS))")
          # org_id|slug|title|location|loc_filter|group
          #   loc_filter: only needed when one Jackrabbit org covers multiple physical
          #     locations (e.g. Bear Paddle) -- keeps just that location's classes.
          #   group: "barron" gets the full Barron sibling list passed as its in-page
          #     location switcher; "solo" gets no --locations-json (defaults to itself,
          #     switcher auto-hides). Same login (email+password) works across all of
          #     these -- each is just a separately-created parent account per org.
          ENTITIES=(
            "544652|barron_ofallon|Barron Swim School|O'Fallon, MO||barron"
            "555050|barron_ballwin|Barron Sports Center|Ballwin, MO||barron"
            "528941|barron_southcounty|Barron Swim School|South County, MO||barron"
            "499027|bearpaddle_bloomingdale|Bear Paddle Swim School & Clubhouse|Bloomingdale, IL|Bear Paddle Bloomingdale|solo"
          )
          FAILED=0
          > generated_slugs.txt
          for entity in "${ENTITIES[@]}"; do
            IFS='|' read -r ORG_ID SLUG TITLE LOCATION LOCFILTER GROUP <<< "$entity"
            echo "::group::$SLUG (org $ORG_ID)"
            EXTRACT_ARGS=(--org-id "$ORG_ID" --out "${SLUG}_raw.json")
            if [ -n "$LOCFILTER" ]; then EXTRACT_ARGS+=(--loc-filter "$LOCFILTER"); fi
            if python3 barron_extract.py "${EXTRACT_ARGS[@]}"; then
              BUILD_ARGS=(--title "$TITLE" --location "$LOCATION" --slug "$SLUG" --date "$DATE")
              if [ "$GROUP" = "barron" ]; then BUILD_ARGS+=(--locations-json "$BARRON_JSON"); fi
              python3 build_barron_dashboard.py "${SLUG}_raw.json" "${BUILD_ARGS[@]}"
              echo "$SLUG.html" >> generated_slugs.txt
            else
              echo "::warning::extraction failed for $SLUG (org $ORG_ID)"
              FAILED=1
            fi
            echo "::endgroup::"
          done
          echo "any_failed=$FAILED" >> "$GITHUB_ENV"
          echo "pull_date=$DATE" >> "$GITHUB_ENV"

      - name: Stamp homepage timestamps
        run: python3 update_competitor_timestamps.py --pull-date "${{ env.pull_date }}"

      - name: Upload login-failure screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: barron-login-failures
          path: barron_login_failure_*.png
          if-no-files-found: ignore

      - name: Upload raw extraction JSON (debugging)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: barron-raw-json
          path: |
            barron_*_raw.json
            bearpaddle_*_raw.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add $(cat generated_slugs.txt) index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-refresh Jackrabbit competitor dashboards $(date -u +%Y-%m-%d)"
            git pull --rebase origin main
            git push
          fi

      - name: Fail the run if any location's extraction failed
        if: env.any_failed == '1'
        run: exit 1
